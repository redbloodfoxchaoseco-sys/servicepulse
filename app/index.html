<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
  <title>ServicePulse</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12h4l2-6 4 12 3-8 2 2h5" />
        </svg>
        <div class="brand-text">
          <h1>ServicePulse</h1>
          <span class="brand-sub">System services monitor</span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="badge" id="platform-badge" title="Runtime platform">
          <span class="dot dot-live" aria-hidden="true"></span><span id="platform-label">Detecting…</span>
        </span>
        <button class="btn btn-icon" id="theme-btn" aria-label="Switch to light mode" title="Toggle light / dark theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
        </button>
        <button class="btn" id="pause-btn" aria-pressed="false" title="Pause live refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14" /></svg>
          <span id="pause-label">Pause</span>
        </button>
      </div>
    </header>

    <main class="content">
      <section class="stats" id="stats" aria-label="System statistics">
        <article class="card stat" id="stat-cpu">
          <header class="stat-head"><span class="stat-label">CPU load</span><span class="stat-sub" id="cpu-sub">—</span></header>
          <div class="stat-value"><span id="cpu-value">—</span><span class="stat-unit">%</span></div>
          <div class="meter" role="img" aria-label="CPU usage meter"><div class="meter-fill" id="cpu-meter"></div></div>
        </article>
        <article class="card stat" id="stat-mem">
          <header class="stat-head"><span class="stat-label">Memory</span><span class="stat-sub" id="mem-sub">—</span></header>
          <div class="stat-value"><span id="mem-value">—</span><span class="stat-unit" id="mem-unit">GB</span></div>
          <div class="meter" role="img" aria-label="Memory usage meter"><div class="meter-fill" id="mem-meter"></div></div>
        </article>
        <article class="card stat" id="stat-net">
          <header class="stat-head"><span class="stat-label">Network</span><span class="stat-sub" id="net-sub">—</span></header>
          <div class="stat-value stat-value-sm" id="net-value">—</div>
          <div class="meter" role="img" aria-label="Network status meter"><div class="meter-fill" id="net-meter"></div></div>
        </article>
        <article class="card stat" id="stat-host">
          <header class="stat-head"><span class="stat-label">Host</span><span class="stat-sub" id="host-sub">—</span></header>
          <div class="stat-value stat-value-sm" id="host-value">—</div>
          <div class="stat-detail" id="host-detail">—</div>
        </article>
      </section>

      <section class="card chart-card" aria-label="Load history">
        <header class="card-head">
          <h2 id="chart-title">Load history</h2>
          <span class="card-meta" id="updated">waiting for first sample…</span>
        </header>
        <div class="chart-wrap">
          <canvas id="chart" width="880" height="140" role="img" aria-label="Line chart of recent load history"></canvas>
        </div>
      </section>

      <section class="card table-card" id="process-section" aria-label="Services">
        <header class="card-head">
          <h2 id="table-title">Running services</h2>
          <div class="table-tools">
            <label class="search-wrap">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
              <input type="search" id="search" placeholder="Filter services…" aria-label="Filter services" autocomplete="off" />
            </label>
          </div>
        </header>
        <div class="table-scroll">
          <table class="services-table">
            <thead>
              <tr>
                <th data-sort="name" scope="col">Service</th>
                <th data-sort="pid" scope="col" class="num">PID</th>
                <th data-sort="cpu" scope="col" class="num">CPU</th>
                <th data-sort="mem" scope="col" class="num">Memory</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="service-rows"></tbody>
          </table>
          <div class="empty-state" id="empty-state" hidden>
            <p>No services match your filter.</p>
          </div>
        </div>
      </section>

      <section class="card detail-card" id="device-section" aria-label="Device details" hidden>
        <header class="card-head">
          <h2>Device details</h2>
          <span class="card-meta" id="device-meta"></span>
        </header>
        <dl class="detail-grid" id="detail-grid"></dl>
      </section>
    </main>

    <footer class="footer">
      <span>ServicePulse · <span id="footer-platform">—</span></span>
      <span class="footer-hint" id="footer-hint"></span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
