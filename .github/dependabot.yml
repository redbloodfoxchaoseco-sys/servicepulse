version: 2
updates:
  # Windows desktop app (Electron)
  - package-ecosystem: npm
    directory: /electron
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - electron

  # Android app (Capacitor)
  - package-ecosystem: npm
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android

  # Keep GitHub Actions workflows current too
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
