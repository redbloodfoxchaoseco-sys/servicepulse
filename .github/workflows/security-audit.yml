# Weekly security audit against certified vulnerability databases.
#
# Data sources:
#   - npm audit   -> GitHub Advisory Database (CVEs + GitHub Security Advisories)
#   - osv-scanner -> OSV.dev (Google's open vulnerability database, aggregates
#                    CVE/NVD, GHSA, PyPA, Go and more) via the official
#                    google/osv-scanner-action reusable workflow
#
# If vulnerabilities are found, a GitHub issue is created and assigned to the
# GitHub Copilot coding agent, which drafts a fix as a pull request.

name: Security audit

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  # the OSV reusable workflow requires at least these
  actions: read
  contents: read
  security-events: write

jobs:
  # --- npm audit against the GitHub Advisory Database ----------------------
  npm-audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.findings.outputs.found }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Electron dependencies
        working-directory: electron
        run: npm audit --audit-level=high --json > "$GITHUB_WORKSPACE/audit-electron.json" || true

      - name: Audit Android dependencies
        working-directory: android
        run: npm audit --audit-level=high --json > "$GITHUB_WORKSPACE/audit-android.json" || true

      - name: Summarize npm audit findings
        run: |
          node -e '
            const fs = require("fs");
            let out = [];
            for (const f of ["audit-electron.json", "audit-android.json"]) {
              try {
                const j = JSON.parse(fs.readFileSync(f, "utf8"));
                const v = (j.metadata && j.metadata.vulnerabilities) || {};
                const total = Object.values(v).reduce((a, b) => a + b, 0);
                out.push(`- ${f.replace("audit-", "").replace(".json", "")}: ${total} vulnerabilities` +
                  (total ? ` (${v.high || 0} high, ${v.critical || 0} critical)` : ""));
              } catch { out.push(`- ${f}: audit could not run`); }
            }
            fs.writeFileSync("npm-summary.md", out.join("\n"));
          '
          cat npm-summary.md

      - name: Check findings
        id: findings
        run: |
          FOUND=0
          grep -qE '[1-9][0-9]* vulnerabilit' npm-summary.md && FOUND=1
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-reports
          path: |
            audit-electron.json
            audit-android.json
            npm-summary.md
          if-no-files-found: ignore

  # --- OSV scan ------------------------------------------------------------
  # Runs the official osv-scanner binary directly. The previous setup called
  # google/osv-scanner-action's reusable workflow, whose reporter step failed
  # on every run (it expects SARIF upload to be enabled); scanning and
  # escalation now live in this repository so failures mean real findings.
  osv-scan:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          VERSION=v2.2.3
          curl -sSfL -o /tmp/osv-scanner             "https://github.com/google/osv-scanner/releases/download/${VERSION}/osv-scanner_linux_amd64"
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan repository
        id: scan
        run: |
          set +e
          osv-scanner scan source -r . --format=json --output=osv-results.json
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -eq 0 ]; then
            echo "No known vulnerabilities."
          elif [ "$CODE" -eq 1 ]; then
            echo "::warning::osv-scanner found vulnerabilities"
          else
            echo "::error::osv-scanner failed with exit code $CODE"
            exit "$CODE"
          fi

      - name: Summarize OSV findings
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let n = 0;
            try {
              const j = JSON.parse(fs.readFileSync("osv-results.json", "utf8"));
              for (const r of j.results || []) n += (r.packages || []).reduce((a, p) => a + (p.vulnerabilities || []).length, 0);
            } catch {}
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n### OSV.dev scan\n\n${n} vulnerable package(s) found.\n`);
            console.log(`${n} vulnerable package(s)`);
          '

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-report
          path: osv-results.json
          if-no-files-found: ignore

      - name: Fail when vulnerabilities were found
        if: steps.scan.outputs.exit_code == '1'
        run: exit 1

  # --- Escalate to the Copilot coding agent if anything was found -----------
  escalate:
    needs: [npm-audit, osv-scan]
    if: always() && (needs.npm-audit.outputs.found == '1' || needs.osv-scan.result == 'failure')
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Open issue for Copilot coding agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Weekly security audit found vulnerabilities"
            echo
            echo "Certified databases consulted: **GitHub Advisory Database** (npm audit) and **OSV.dev** (osv-scanner)."
            echo
            echo "Workflow run: ${RUN_URL}"
            echo
            echo "Full reports are attached to the workflow run as artifacts."
            echo
            echo "### Requested protocol"
            echo
            echo "Copilot: please remediate every high or critical finding, preferring minimal version bumps that satisfy the advisory range. Run the project checks described in MAINTENANCE.md and open a pull request with the fixes."
          } > issue-body.md
          gh label create security --color d1242f --description "Security finding from the audit workflow" 2>/dev/null || true
          if gh api "repos/$REPO/assignees/copilot-swe-agent" --silent 2>/dev/null; then
            ISSUE=$(gh issue create \
              --repo "$REPO" \
              --title "Security audit: vulnerabilities found ($(date -u +%Y-%m-%d))" \
              --body-file issue-body.md \
              --assignee copilot-swe-agent)
          else
            echo "::notice::Copilot coding agent is not assignable yet (enable it in Settings → Copilot). Creating the issue unassigned."
            ISSUE=$(gh issue create \
              --repo "$REPO" \
              --title "Security audit: vulnerabilities found ($(date -u +%Y-%m-%d))" \
              --body-file issue-body.md)
          fi
          gh issue edit "$ISSUE" --repo "$REPO" --add-label security 2>/dev/null \
            || echo "::notice::label 'security' unavailable, issue created without it"
          echo "Created: $ISSUE"
