# Weekly maintenance cycle for ServicePulse.
#
# Protocol (see MAINTENANCE.md):
#   1. Install dependencies exactly as locked (npm ci)
#   2. Apply safe security patches (npm audit fix — no breaking changes)
#   3. Verify the shared UI is synced into both build targets
#   4. Lint/syntax-check all shipped JavaScript
#   5. Rebuild the Android debug APK and upload it as an artifact
#   6. If anything fails, open an issue assigned to the Copilot coding agent

name: Maintenance cycle

on:
  schedule:
    - cron: '0 7 * * 1' # every Monday 07:00 UTC (after the security audit)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies (electron)
        working-directory: electron
        run: npm ci

      - name: Install dependencies (android)
        working-directory: android
        run: npm ci

      - name: Apply safe security patches
        run: |
          (cd electron && npm audit fix || true)
          (cd android && npm audit fix || true)

      - name: Verify shared UI is synced
        run: |
          node scripts/sync-web.js
          if ! git diff --exit-code --quiet; then
            echo "::error::electron/app or android/www is out of sync with app/ — run scripts/sync-web.js and commit"
            git diff --stat
            exit 1
          fi

      - name: Syntax-check shipped JavaScript
        run: |
          node --check app/app.js
          node --check electron/main.js
          node --check electron/preload.js

      - name: Build Android debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServicePulse-debug-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Open maintenance issue for Copilot on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --repo "$REPO" \
            --title "Maintenance cycle failed ($(date -u +%Y-%m-%d))" \
            --body "The weekly maintenance workflow failed. Copilot: please investigate the failing step in the workflow run, fix the root cause following the protocols in MAINTENANCE.md, and open a pull request." \
            --assignee copilot-swe-agent \
            --label maintenance
