<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServicePulse NativeBridge</title>
  <style>
    :root {
      --bg: #0e1218; --surface: #141a23; --border: #26303f;
      --text: #dbe2ec; --muted: #8b96a5; --accent: #3ecf9e; --err: #ff6b6b;
      --mono: ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--mono); background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 24px; display: flex; flex-direction: column; gap: 16px;
    }
    header { display: flex; align-items: center; gap: 10px; }
    header svg { color: var(--accent); }
    h1 { font-size: 1.1rem; letter-spacing: .02em; }
    .sub { color: var(--muted); font-size: .8rem; margin-top: -10px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .card h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    button {
      font-family: var(--mono); font-size: .85rem; color: #0e1218; background: var(--accent);
      border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 600; cursor: pointer;
    }
    button:active { filter: brightness(.9); }
    pre {
      background: #0a0e13; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; font-size: .78rem; white-space: pre-wrap; word-break: break-all;
      min-height: 44px; color: var(--accent);
    }
    pre.err { color: var(--err); }
  </style>
</head>
<body>
  <header>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l2-6 4 12 3-8 2 2h5" /></svg>
    <h1>ServicePulse NativeBridge</h1>
  </header>
  <p class="sub">Capacitor scaffold · custom native plugin bridge demo</p>

  <div class="card">
    <h2>ping()</h2>
    <button onclick="doPing()">Call NativeBridge.ping()</button>
    <pre id="out-ping">—</pre>
  </div>

  <div class="card">
    <h2>hasNotificationAccess()</h2>
    <button onclick="doCheck()">Check notification access</button>
    <pre id="out-check">—</pre>
  </div>

  <div class="card">
    <h2>openNotificationAccessSettings()</h2>
    <button onclick="doOpen()">Open system notification access settings</button>
    <pre id="out-open">—</pre>
  </div>

  <script>
    function getPlugin() {
      return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.NativeBridge) || null;
    }
    function show(id, data, isErr) {
      var el = document.getElementById(id);
      el.textContent = JSON.stringify(data, null, 2);
      el.className = isErr ? 'err' : '';
    }
    function doPing() {
      var p = getPlugin();
      if (!p) return show('out-ping', 'NativeBridge plugin not available (run on Android)', true);
      p.ping().then(function (r) { show('out-ping', r); },
                    function (e) { show('out-ping', e, true); });
    }
    function doCheck() {
      var p = getPlugin();
      if (!p) return show('out-check', 'NativeBridge plugin not available (run on Android)', true);
      p.hasNotificationAccess().then(function (r) { show('out-check', r); },
                                     function (e) { show('out-check', e, true); });
    }
    function doOpen() {
      var p = getPlugin();
      if (!p) return show('out-open', 'NativeBridge plugin not available (run on Android)', true);
      p.openNotificationAccessSettings().then(function (r) { show('out-open', 'settings opened'); },
                                              function (e) { show('out-open', e, true); });
    }
  </script>
</body>
</html>
