name: OSV test
on: workflow_dispatch
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: true
      upload-sarif: false
